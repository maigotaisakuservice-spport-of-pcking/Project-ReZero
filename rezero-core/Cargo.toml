[package]
name = "rezero-core"
version = "1.0.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
z3 = { version = "0.12" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
pest = "2.7"
pest_derive = "2.7"
tempfile = "3.8"
