name: Build and Release ReZero Core

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Compiler for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rezero-compiler-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rezero-compiler-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rezero-compiler-windows.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Z3 (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libz3-dev

    - name: Build Core Compiler
      run: cargo build --manifest-path rezero-core/Cargo.toml --release --target ${{ matrix.target }}

    - name: Prepare Artifact
      run: |
        mkdir -p dist/
        cp rezero-core/target/${{ matrix.target }}/release/rezero-core* dist/
      shell: bash

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
