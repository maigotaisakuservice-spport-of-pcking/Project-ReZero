name: Build and Release ReZero Core

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Compiler for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rezero-compiler-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rezero-compiler-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rezero-compiler-windows.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Clang & Z3 Libraries (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld libz3-dev

    - name: Install Z3 (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install z3
        echo "Z3_SYS_Z3_HEADER=/opt/homebrew/include/z3.h" >> $GITHUB_ENV

    - name: Install Z3 (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install z3:x64-windows
        echo "Z3_SYS_NO_PKG_CONFIG=1" >> $GITHUB_ENV
        # Find Z3 include directory in vcpkg
        echo "Z3_SYS_Z3_HEADER=C:/hostedtoolcache/windows/vcpkg/installed/x64-windows/include/z3.h" >> $GITHUB_ENV
      shell: bash

    - name: Build Core Compiler
      run: cargo build --manifest-path rezero-core/Cargo.toml --release --target ${{ matrix.target }}

    - name: Rename and Prepare Release Artifact
      run: |
        mkdir -p dist/
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp rezero-core/target/${{ matrix.target }}/release/rezero-core.exe dist/${{ matrix.artifact_name }}
        else
          cp rezero-core/target/${{ matrix.target }}/release/rezero-core dist/${{ matrix.artifact_name }}
        fi
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/

    - name: Create Release and Upload Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/rezero-compiler-linux/rezero-compiler-linux
          dist/rezero-compiler-macos/rezero-compiler-macos
          dist/rezero-compiler-windows.exe/rezero-compiler-windows.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
